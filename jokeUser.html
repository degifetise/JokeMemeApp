<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Joke Generator</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #123;
  transition: background 0.3s;
}

/* body.light {
  background: #f4f4f2;
} */

.hidden { display: none; }

.card {
  width: 430px;
  padding: 30px;
  background: #134;
  color: #fff;
  border-radius: 12px;
  text-align: center;
  border: 6px solid #199;
}

body.light .card {
  background: #fff;
  color: #222;
}

h1 {
  margin-bottom: 10px;
}
select {
-webkit-appearance: none;
}
input, select, button {
  width: 100%;
  margin: 8px 0;
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  font-weight: bold;
}

button {
  cursor: pointer;
  background: #199;
  color: #fff;
}

button:hover {
  background: #1cc;
}

#setup {
  color: #199;
  font-size: 18px;
  margin: 15px 0;
}

#punchline {
  font-size: 26px;
  opacity: 0;
  transform: translateY(10px);
  transition: 0.4s;
}

#punchline.show {
  opacity: 1;
  transform: translateY(0);
}

.controls button {
  background: #444;
}

.likes {
  margin-top: 10px;
  font-size: 14px;
}

footer {
  margin-top: 15px;
  font-size: 12px;
  opacity: 0.8;
}
</style>
</head>

<body>


<div class="card" id="auth">
  <h1>👋 Welcome</h1>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="signin()">Sign In</button>

  <p id="auth-msg"></p>
</div>


<div class="card hidden" id="app">
  <h1>😂 Joke Generator</h1>
  <p id="greeting"></p>

  <select id="category">
    <option value="random">Random</option>
    <option value="programming">Programming</option>
    <option value="general">General</option>
  </select>

  <p id="setup">Click below to get a joke</p>
  <p id="punchline"></p>

  <button id="joke-btn">Get Joke</button>

  <div class="controls">
    <button id="like">👍 Like</button>
    <button id="dislike">👎 Dislike</button>
  </div>

  <div class="likes">
    Likes: <span id="likes">0</span> |
    Dislikes: <span id="dislikes">0</span>
  </div>

  <button onclick="logout()">Logout</button>

  <footer>
    👨‍💻 Made for Programmers | Created by <strong>Degife</strong>
  </footer>
</div>

<audio id="sound">
  <source src="https://www.soundjay.com/buttons/sounds/button-09.mp3">
</audio>

<script>

const authBox = document.getElementById("auth");
const appBox = document.getElementById("app");
const authMsg = document.getElementById("auth-msg");
const greetingEl = document.getElementById("greeting");

function signup() {
  const u = username.value.trim();
  const p = password.value.trim();

  if (!u || !p) {
    authMsg.textContent = "Please enter username and password";
    return;
  }

  localStorage.setItem("user", JSON.stringify({ u, p }));
  authMsg.textContent = "Signup successful! Please sign in.";
}

function signin() {
  const saved = JSON.parse(localStorage.getItem("user"));
  if (!saved) {
    authMsg.textContent = "No user found. Sign up first.";
    return;
  }

  if (username.value === saved.u && password.value === saved.p) {
    localStorage.setItem("session", saved.u);
    loadApp();
  } else {
    authMsg.textContent = "Invalid username or password";
  }
}

function logout() {
  localStorage.removeItem("session");
  appBox.classList.add("hidden");
  authBox.classList.remove("hidden");
}

function loadApp() {
  authBox.classList.add("hidden");
  appBox.classList.remove("hidden");
  greetingEl.textContent = `👋 Welcome ${localStorage.getItem("session")}!`;
}

if (localStorage.getItem("session")) loadApp();

const setupEl = document.getElementById("setup");
const punchEl = document.getElementById("punchline");
const jokeBtn = document.getElementById("joke-btn");
const category = document.getElementById("category");
const sound = document.getElementById("sound");

const likesEl = document.getElementById("likes");
const dislikesEl = document.getElementById("dislikes");

let likes = localStorage.getItem("likes") || 0;
let dislikes = localStorage.getItem("dislikes") || 0;

likesEl.textContent = likes;
dislikesEl.textContent = dislikes;

async function getJoke() {
  jokeBtn.disabled = true;
  jokeBtn.textContent = "Loading...";
  punchEl.classList.remove("show");

  let url = "https://official-joke-api.appspot.com/jokes/random";
  if (category.value !== "random") {
    url = `https://official-joke-api.appspot.com/jokes/${category.value}/random`;
  }

  try {
    const res = await fetch(url);
    const data = await res.json();
    const joke = Array.isArray(data) ? data[0] : data;

    setupEl.textContent = joke.setup;
    punchEl.textContent = joke.punchline || joke.punch;

    setTimeout(() => {
      punchEl.classList.add("show");
      sound.play();
      jokeBtn.disabled = false;
      jokeBtn.textContent = "Get Joke";
    }, 600);
  } catch {
    setupEl.textContent = "Why do programmers love JavaScript?";
    punchEl.textContent = "Because it always callbacks 😄";
    punchEl.classList.add("show");
    jokeBtn.disabled = false;
    jokeBtn.textContent = "Get Joke";
  }
}

jokeBtn.onclick = getJoke;

document.getElementById("like").onclick = () => {
  likes++;
  likesEl.textContent = likes;
  localStorage.setItem("likes", likes);
};

document.getElementById("dislike").onclick = () => {
  dislikes++;
  dislikesEl.textContent = dislikes;
  localStorage.setItem("dislikes", dislikes);
};
</script>

</body>
</html>
