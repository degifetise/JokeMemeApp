<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Joke Generator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="card" id="auth">
  <h1>👋 Welcome</h1>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <button onclick="signup()">Sign Up</button>
  <button onclick="signin()">Sign In</button>

  <p id="auth-msg"></p>
</div>


<div class="card hidden" id="app">
  <h1>😂 Joke Generator</h1>
  <p id="greeting"></p>

  <select id="category">
    <option value="random">Random</option>
    <option value="programming">Programming</option>
    <option value="general">General</option>
  </select>

  <p id="setup">Click below to get a joke</p>
  <p id="punchline"></p>

  <button id="joke-btn">Get Joke</button>

  <div class="controls">
    <button id="like">👍 Like</button>
    <button id="dislike">👎 Dislike</button>
  </div>

  <div class="likes">
    Likes: <span id="likes">0</span> |
    Dislikes: <span id="dislikes">0</span>
  </div>

  <button onclick="logout()">Logout</button>

  <footer>
    👨‍💻 Made for Programmers | Created by <strong>Degife</strong>
  </footer>
</div>

<audio id="sound">
  <source src="https://www.soundjay.com/buttons/sounds/button-09.mp3">
</audio>

<script src="script.js"></script>
</body>
</html>
